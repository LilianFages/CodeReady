<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08111f"><meta name="color-scheme" content="dark"><title>Coach Héloïse — CodeReady</title><style>
:root{--bg:#07101d;--panel:#0e1d2e;--panel2:#12243a;--text:#f4f8fc;--muted:#93a7bc;--line:rgba(255,255,255,.085);--green:#58e3a7;--blue:#68b6ff;--yellow:#ffc86b;--red:#ff7585;--shadow:0 22px 64px rgba(0,0,0,.28);--content:1320px}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% -5%,rgba(104,182,255,.16),transparent 30%),radial-gradient(circle at 100% 5%,rgba(88,227,167,.11),transparent 25%),linear-gradient(180deg,#07101d,#081421 50%,#07101d);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}a{text-decoration:none;color:inherit}button{font:inherit;color:inherit}.page{width:min(var(--content),calc(100% - 40px));margin:auto;padding:20px 0 70px}.head{height:66px;position:sticky;top:14px;z-index:20;border:1px solid var(--line);border-radius:18px;background:rgba(11,25,41,.88);backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:space-between;padding:0 18px}.brand{display:flex;align-items:center;gap:10px;font-weight:900}.mark{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--green),#47cfe6);color:#04131b}.nav{display:flex;gap:8px}.btn{border:0;border-radius:13px;padding:11px 15px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:850;cursor:pointer}.primary{background:linear-gradient(135deg,var(--green),#48d1d1);color:#04131b}.secondary{background:rgba(255,255,255,.05);border:1px solid var(--line)}.stage{margin-top:18px}.start{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(340px,.75fr);gap:16px}.card{border:1px solid var(--line);background:rgba(13,29,47,.9);border-radius:26px;box-shadow:var(--shadow)}.main{padding:38px}.eyebrow{display:inline-flex;padding:7px 10px;border:1px solid rgba(88,227,167,.2);background:rgba(88,227,167,.07);border-radius:999px;color:#bff5db;font-size:.72rem;font-weight:900}.main h1{font-size:clamp(2.8rem,5vw,5.2rem);line-height:.94;letter-spacing:-.06em;margin:18px 0}.main p{color:var(--muted);line-height:1.65;max-width:760px}.support{margin-top:22px;border-left:3px solid var(--green);padding:12px 15px;background:rgba(88,227,167,.05);border-radius:0 13px 13px 0;color:#cfe3ef;font-size:.82rem;line-height:1.55}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:24px}.side{padding:18px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{padding:15px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.03)}.stat b{display:block;font-size:1.5rem}.stat span{font-size:.7rem;color:var(--muted)}.weak{margin-top:10px;border:1px solid var(--line);border-radius:15px;padding:14px}.weak h3{font-size:.78rem;margin:0 0 10px}.weak-row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid rgba(255,255,255,.05);font-size:.73rem;color:var(--muted)}.weak-row:first-of-type{border-top:0}.weak-row b{color:#fff}.quiz{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}.qpanel,.qside{border:1px solid var(--line);background:rgba(13,29,47,.92);border-radius:24px;box-shadow:var(--shadow)}.qpanel{overflow:hidden}.qhead{height:72px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.counter{font-weight:900}.theme{font-size:.72rem;color:var(--muted);margin-top:3px}.body{padding:24px}.visual{height:175px;border:1px solid var(--line);border-radius:17px;background:linear-gradient(180deg,#244c70 0 49%,#142236 49%);display:grid;place-items:center;font-size:5rem;margin-bottom:20px}.question{font-size:clamp(1.4rem,2.5vw,2rem);line-height:1.23;letter-spacing:-.03em;margin:0 0 15px}.multi{font-size:.72rem;color:var(--muted);margin-top:-7px;margin-bottom:13px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choice{border:1px solid var(--line);background:rgba(255,255,255,.035);border-radius:13px;padding:12px;display:grid;grid-template-columns:34px 1fr;gap:9px;align-items:center;text-align:left;cursor:pointer;min-height:62px}.choice.sel{border-color:rgba(88,227,167,.38);background:rgba(88,227,167,.08)}.choice.good{border-color:rgba(88,227,167,.5);background:rgba(88,227,167,.1)}.choice.bad{border-color:rgba(255,117,133,.5);background:rgba(255,117,133,.08)}.letter{width:31px;height:31px;border-radius:9px;background:rgba(255,255,255,.06);display:grid;place-items:center;font-weight:900}.feedback{margin-top:15px;border-radius:14px;padding:14px 15px;font-size:.82rem;line-height:1.55}.feedback.ok{background:rgba(88,227,167,.07);border:1px solid rgba(88,227,167,.2)}.feedback.no{background:rgba(255,117,133,.06);border:1px solid rgba(255,117,133,.18)}.qactions{margin-top:16px;display:flex;justify-content:flex-end;gap:8px}.qside{padding:15px;position:sticky;top:98px}.map{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.dot{aspect-ratio:1;border:1px solid var(--line);border-radius:9px;display:grid;place-items:center;font-size:.68rem;color:var(--muted);font-weight:900}.dot.cur{border-color:rgba(104,182,255,.5);background:rgba(104,182,255,.1);color:#fff}.dot.done{border-color:rgba(88,227,167,.25);background:rgba(88,227,167,.07)}.dot.wrong{border-color:rgba(255,117,133,.27);background:rgba(255,117,133,.07)}.tip{margin-top:12px;padding:13px;border:1px solid var(--line);border-radius:13px;color:var(--muted);font-size:.73rem;line-height:1.5}.finish{text-align:center;padding:50px}.finish h1{font-size:4rem;margin:0}.finish p{color:var(--muted);line-height:1.6}.mobile{display:none}
@media(max-width:900px){.start,.quiz{grid-template-columns:1fr}.qside{position:static}.choices{grid-template-columns:1fr}.nav .secondary{display:none}}
@media(max-width:650px){body{padding-bottom:78px}.page{width:calc(100% - 20px);padding-top:10px}.head{height:56px;top:8px;padding:0 12px}.brand span:last-child{font-size:.85rem}.main{padding:24px 20px}.main h1{font-size:3rem}.body{padding:15px}.visual{height:140px}.qside{display:none}.mobile{display:grid;grid-template-columns:repeat(3,1fr);position:fixed;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));padding:6px;background:rgba(8,18,31,.94);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:17px;z-index:50}.mobile a{text-align:center;padding:10px;border-radius:11px;color:var(--muted);font-size:.75rem;font-weight:850}.mobile a.active{background:rgba(88,227,167,.1);color:#d2f7e5}}
</style></head><body><div class="page"><header class="head"><a class="brand" href="index.html"><span class="mark">♥</span><span>CodeReady · Héloïse</span></a><nav class="nav"><a class="btn secondary" href="index.html">📚 Les 50</a><a class="btn secondary" href="examen.html">🎯 Examen</a></nav></header><main class="stage" id="app"></main></div><nav class="mobile"><a href="index.html">📚 Réviser</a><a class="active" href="coach.html">✨ Coach</a><a href="examen.html">🎯 Examen</a></nav><script>
const QUESTION_BANK=[{"id":"L001","category":"L","categoryName":"Circulation","icon":"🛣️","question":"Sur autoroute, par temps sec et hors signalisation contraire, la vitesse maximale d’une voiture est :","choices":["110 km/h","120 km/h","130 km/h","140 km/h"],"answers":[2],"explanation":"La limitation générale sur autoroute est de 130 km/h par temps sec.","difficulty":"moyen","visual":"speed:130","top":true},{"id":"L002","category":"L","categoryName":"Circulation","icon":"🛣️","question":"Sous la pluie, la vitesse maximale générale sur autoroute est :","choices":["90 km/h","100 km/h","110 km/h","130 km/h"],"answers":[2],"explanation":"Sous la pluie, la limitation générale sur autoroute est abaissée à 110 km/h.","difficulty":"moyen","visual":"rain","top":true},{"id":"L003","category":"L","categoryName":"Circulation","icon":"🛣️","question":"À un panneau STOP, je dois :","choices":["Simplement ralentir","Marquer un arrêt complet","M’arrêter seulement si un véhicule arrive","Passer si je tourne à droite"],"answers":[1],"explanation":"Le STOP impose un arrêt complet à la ligne d’effet, puis le respect des règles de priorité.","difficulty":"moyen","visual":"stop","top":true},{"id":"L004","category":"L","categoryName":"Circulation","icon":"🛣️","question":"À une intersection sans panneau ni feu, la règle générale est :","choices":["Priorité à gauche","Priorité au véhicule le plus rapide","Priorité à droite","Priorité au véhicule le plus gros"],"answers":[2],"explanation":"Sans signalisation particulière, la priorité à droite s’applique.","difficulty":"moyen","visual":"intersection","top":true},{"id":"L005","category":"L","categoryName":"Circulation","icon":"🛣️","question":"Un feu orange fixe s’allume alors que je peux m’arrêter sans danger. Je dois :","choices":["Accélérer","M’arrêter","Klaxonner","Passer systématiquement"],"answers":[1],"explanation":"Le feu orange fixe impose l’arrêt, sauf si celui-ci ne peut être effectué dans des conditions de sécurité suffisantes.","difficulty":"moyen","visual":"amber","top":true},{"id":"L006","category":"L","categoryName":"Circulation","icon":"🛣️","question":"Un feu rouge m’impose :","choices":["Un ralentissement","Un arrêt","De céder seulement aux piétons","De passer si la voie paraît libre"],"answers":[1],"explanation":"Le feu rouge impose l’arrêt avant la ligne d’effet, le passage piéton ou le feu.","difficulty":"moyen","visual":"red","top":false},{"id":"L007","category":"L","categoryName":"Circulation","icon":"🛣️","question":"Un feu orange clignotant, sans autre signalisation de priorité, signifie généralement :","choices":["Arrêt obligatoire","Passage libre sans précaution","Prudence et application des règles de priorité","Priorité absolue"],"answers":[2],"explanation":"Le feu orange clignotant attire l’attention sur un danger ; les règles de priorité restent à appliquer.","difficulty":"moyen","visual":"amber","top":false},{"id":"L008","category":"L","categoryName":"Circulation","icon":"🛣️","question":"Je change de voie. Qui est prioritaire ?","choices":["Moi si j’ai mis le clignotant","Les véhicules déjà présents sur la voie visée","Le véhicule le plus rapide","Personne"],"answers":[1],"explanation":"Le clignotant informe mais ne donne jamais la priorité. Je dois céder aux véhicules déjà engagés sur la voie.","difficulty":"moyen","visual":"lane","top":false},{"id":"L009","category":"L","categoryName":"Circulation","icon":"🛣️","question":"Pour dépasser un cycliste, je dois laisser au minimum :","choices":["50 cm partout","1 m en agglomération et 1,5 m hors agglomération","2 m partout","Aucune distance minimale"],"answers":[1],"explanation":"La distance latérale minimale est d’1 m en agglomération et 1,5 m hors agglomération.","difficulty":"moyen","visual":"bike","top":false},{"id":"L010","category":"L","categoryName":"Circulation","icon":"🛣️","question":"À un passage à niveau dont le feu rouge clignote, je dois :","choices":["Passer si je ne vois pas de train","M’arrêter","Accélérer pour traverser vite","M’arrêter uniquement si les barrières sont baissées"],"answers":[1],"explanation":"Le feu rouge clignotant d’un passage à niveau impose l’arrêt.","difficulty":"moyen","visual":"rail","top":false},{"id":"L011","category":"L","categoryName":"Circulation","icon":"🛣️","question":"Je peux franchir une ligne continue pour dépasser un véhicule lent :","choices":["Oui toujours","Non, en principe","Oui si je klaxonne","Oui la nuit"],"answers":[1],"explanation":"Le franchissement d’une ligne continue est interdit sauf exceptions prévues par le Code ; on ne la franchit pas pour un dépassement ordinaire.","difficulty":"moyen","visual":"solidline","top":false},{"id":"L012","category":"L","categoryName":"Circulation","icon":"🛣️","question":"Sur autoroute, la bande d’arrêt d’urgence sert principalement :","choices":["À téléphoner","À dépasser","Aux arrêts d’urgence et interventions","À rouler quand il y a des bouchons"],"answers":[2],"explanation":"La bande d’arrêt d’urgence est réservée aux situations d’urgence et aux véhicules autorisés.","difficulty":"moyen","visual":"motorway","top":false},{"id":"C001","category":"C","categoryName":"Conducteur","icon":"🧠","question":"Pour un conducteur non novice, le taux maximal d’alcool autorisé est en principe :","choices":["0,2 g/L de sang","0,5 g/L de sang","0,8 g/L de sang","1,0 g/L de sang"],"answers":[1],"explanation":"La limite générale est 0,5 g/L de sang.","difficulty":"moyen","visual":"alcohol","top":true},{"id":"C002","category":"C","categoryName":"Conducteur","icon":"🧠","question":"Pendant la période probatoire, le taux maximal d’alcool autorisé est :","choices":["0,0 g/L","0,2 g/L","0,5 g/L","0,8 g/L"],"answers":[1],"explanation":"Pour les conducteurs en permis probatoire, la limite est 0,2 g/L de sang.","difficulty":"moyen","visual":"alcohol","top":true},{"id":"C003","category":"C","categoryName":"Conducteur","icon":"🧠","question":"Tenir son téléphone en main en conduisant est :","choices":["Autorisé à faible vitesse","Autorisé au feu rouge","Interdit","Autorisé avec le haut-parleur"],"answers":[2],"explanation":"Le téléphone tenu en main est interdit en circulation, y compris lors d’un arrêt momentané dans le trafic.","difficulty":"moyen","visual":"phone","top":true},{"id":"C004","category":"C","categoryName":"Conducteur","icon":"🧠","question":"Une pause est recommandée environ toutes les :","choices":["30 min","1 h","2 h","4 h"],"answers":[2],"explanation":"Faire une pause environ toutes les 2 heures réduit le risque lié à la fatigue.","difficulty":"moyen","visual":"coffee","top":true},{"id":"C005","category":"C","categoryName":"Conducteur","icon":"🧠","question":"Si ma vitesse double, la distance de freinage est approximativement :","choices":["Deux fois plus grande","Trois fois plus grande","Quatre fois plus grande","Inchangée"],"answers":[2],"explanation":"La distance de freinage varie approximativement avec le carré de la vitesse : doubler la vitesse la multiplie par environ 4.","difficulty":"moyen","visual":"brake","top":true},{"id":"C006","category":"C","categoryName":"Conducteur","icon":"🧠","question":"Le temps de réaction d’un conducteur attentif est généralement de l’ordre de :","choices":["0,1 s","1 s","5 s","10 s"],"answers":[1],"explanation":"On retient généralement environ 1 seconde dans de bonnes conditions, davantage en cas de fatigue, alcool ou distraction.","difficulty":"moyen","visual":"reaction","top":false},{"id":"C007","category":"C","categoryName":"Conducteur","icon":"🧠","question":"Pour “faire baisser” plus vite l’alcoolémie, le café est :","choices":["Très efficace","Un peu efficace","Inefficace sur l’élimination de l’alcool","Efficace seulement avec une douche froide"],"answers":[2],"explanation":"Seul le temps permet à l’organisme d’éliminer l’alcool ; café, douche ou sport n’accélèrent pas significativement cette élimination.","difficulty":"moyen","visual":"coffee","top":false},{"id":"C008","category":"C","categoryName":"Conducteur","icon":"🧠","question":"Le cannabis peut notamment :","choices":["Améliorer l’attention","Allonger le temps de réaction","Réduire la fatigue","Améliorer la vision nocturne"],"answers":[1],"explanation":"Le cannabis altère l’attention, la perception et le temps de réaction.","difficulty":"moyen","visual":"warning","top":false},{"id":"C009","category":"C","categoryName":"Conducteur","icon":"🧠","question":"Un médicament avec un pictogramme de conduite de niveau élevé doit m’amener à :","choices":["Ignorer l’avertissement","Lire la notice et demander conseil au besoin","Doubler la dose","Conduire plus vite pour réduire le trajet"],"answers":[1],"explanation":"Les pictogrammes médicaments signalent un risque pour la conduite ; la notice et l’avis d’un professionnel de santé sont à prendre en compte.","difficulty":"moyen","visual":"medicine","top":false},{"id":"C010","category":"C","categoryName":"Conducteur","icon":"🧠","question":"La somnolence au volant peut être annoncée par :","choices":["Bâillements et paupières lourdes","Meilleure concentration","Hausse de l’acuité visuelle","Réflexes plus rapides"],"answers":[0],"explanation":"Bâillements, raideur de nuque, difficultés à maintenir la trajectoire et paupières lourdes sont des signes d’alerte.","difficulty":"moyen","visual":"sleep","top":false},{"id":"C011","category":"C","categoryName":"Conducteur","icon":"🧠","question":"La distance d’arrêt comprend :","choices":["Uniquement la distance de freinage","Distance de réaction + distance de freinage","Uniquement la distance de réaction","La longueur du véhicule"],"answers":[1],"explanation":"Distance d’arrêt = distance parcourue pendant le temps de réaction + distance de freinage.","difficulty":"moyen","visual":"brake","top":false},{"id":"C012","category":"C","categoryName":"Conducteur","icon":"🧠","question":"Conduire stressé ou très énervé peut :","choices":["Réduire les erreurs","Altérer les décisions et la perception du risque","N’avoir aucun effet","Améliorer systématiquement les réflexes"],"answers":[1],"explanation":"Un état émotionnel intense peut dégrader l’attention et la prise de décision.","difficulty":"moyen","visual":"warning","top":false},{"id":"R001","category":"R","categoryName":"Route","icon":"🌧️","question":"Si la visibilité est inférieure à 50 m à cause du brouillard, ma vitesse maximale est :","choices":["30 km/h","50 km/h","70 km/h","90 km/h"],"answers":[1],"explanation":"Quand la visibilité est inférieure à 50 m, la vitesse maximale est limitée à 50 km/h sur toutes les routes.","difficulty":"moyen","visual":"fog","top":true},{"id":"R002","category":"R","categoryName":"Route","icon":"🌧️","question":"Sur chaussée mouillée, la distance de freinage :","choices":["Diminue","Augmente","Ne change jamais","Devient nulle avec l’ABS"],"answers":[1],"explanation":"L’adhérence diminue sur chaussée mouillée : la distance de freinage augmente.","difficulty":"moyen","visual":"rain","top":true},{"id":"R003","category":"R","categoryName":"Route","icon":"🌧️","question":"En cas d’aquaplanage, je dois surtout :","choices":["Freiner brutalement","Donner de grands coups de volant","Relâcher progressivement l’accélérateur et garder le volant stable","Accélérer fortement"],"answers":[2],"explanation":"Les gestes brusques aggravent la perte d’adhérence ; il faut réduire progressivement l’allure et garder une trajectoire stable.","difficulty":"moyen","visual":"rain","top":true},{"id":"R004","category":"R","categoryName":"Route","icon":"🌧️","question":"Pour entrer sur autoroute par une voie d’insertion, je dois :","choices":["Être prioritaire","M’insérer en cédant le passage","M’arrêter en bout de voie dans tous les cas","Rouler sur la bande d’arrêt d’urgence"],"answers":[1],"explanation":"La voie d’insertion ne rend pas prioritaire : j’adapte mon allure et je cède le passage aux véhicules déjà sur l’autoroute.","difficulty":"moyen","visual":"motorway","top":true},{"id":"R005","category":"R","categoryName":"Route","icon":"🌧️","question":"En cas de panne sur autoroute, après m’être immobilisé au mieux en sécurité, je dois notamment :","choices":["Rester devant la voiture","Sortir côté circulation","Me mettre derrière la glissière si possible","Marcher sur l’autoroute pour chercher de l’aide"],"answers":[2],"explanation":"Les occupants doivent quitter le véhicule du côté opposé à la circulation et se placer derrière la glissière lorsque c’est possible.","difficulty":"moyen","visual":"breakdown","top":true},{"id":"R006","category":"R","categoryName":"Route","icon":"🌧️","question":"Dans un tunnel, j’allume au minimum :","choices":["Les feux de position seuls","Les feux de croisement","Les feux de route","Aucun feu de jour"],"answers":[1],"explanation":"Les feux de croisement assurent la visibilité du véhicule dans un tunnel.","difficulty":"moyen","visual":"tunnel","top":false},{"id":"R007","category":"R","categoryName":"Route","icon":"🌧️","question":"Sur neige ou verglas, la bonne conduite consiste à :","choices":["Multiplier les gestes brusques","Augmenter les distances et conduire avec douceur","Freiner le plus tard possible","Suivre de très près le véhicule devant"],"answers":[1],"explanation":"Sur faible adhérence, on augmente les distances et on évite les accélérations, freinages et braquages brusques.","difficulty":"moyen","visual":"snow","top":false},{"id":"R008","category":"R","categoryName":"Route","icon":"🌧️","question":"Par fort vent latéral, je dois :","choices":["Tenir fermement le volant et anticiper les écarts","Rouler plus vite","Me rapprocher des poids lourds","Freiner au milieu de ma voie sans raison"],"answers":[0],"explanation":"Le vent peut déporter le véhicule, surtout à la sortie d’une zone abritée ou lors du dépassement d’un poids lourd.","difficulty":"moyen","visual":"wind","top":false},{"id":"R009","category":"R","categoryName":"Route","icon":"🌧️","question":"Faire demi-tour sur autoroute est :","choices":["Autorisé si la route est vide","Interdit","Autorisé la nuit","Autorisé sur la bande d’arrêt d’urgence"],"answers":[1],"explanation":"Demi-tour et marche arrière sont interdits sur autoroute.","difficulty":"moyen","visual":"motorway","top":false},{"id":"R010","category":"R","categoryName":"Route","icon":"🌧️","question":"Une chaussée brillante par temps froid peut annoncer :","choices":["Une adhérence parfaite","Du verglas","Un marquage neuf uniquement","Aucun danger particulier"],"answers":[1],"explanation":"Le verglas peut être difficile à voir ; les zones ombragées, ponts et chaussées humides sont particulièrement à risque.","difficulty":"moyen","visual":"ice","top":false},{"id":"R011","category":"R","categoryName":"Route","icon":"🌧️","question":"À l’approche d’un chantier, je dois :","choices":["Maintenir absolument ma vitesse","Adapter ma vitesse et anticiper les changements de voie","Ignorer le balisage temporaire","Suivre uniquement les marquages permanents"],"answers":[1],"explanation":"La signalisation temporaire prime sur la signalisation permanente lorsqu’elles sont en contradiction.","difficulty":"moyen","visual":"works","top":false},{"id":"R012","category":"R","categoryName":"Route","icon":"🌧️","question":"Sur autoroute encombrée, le corridor de sécurité pour les secours se crée :","choices":["Sur la bande d’arrêt d’urgence uniquement","Entre les deux files les plus à gauche","Au milieu de chaque voie","Sur la file de droite seulement"],"answers":[1],"explanation":"En circulation très ralentie, les véhicules s’écartent pour créer un corridor entre les deux voies les plus à gauche.","difficulty":"moyen","visual":"emergency","top":false},{"id":"U001","category":"U","categoryName":"Autres usagers","icon":"🚲","question":"Un piéton manifeste clairement l’intention de traverser sur un passage piéton. Je dois :","choices":["Accélérer","Lui céder le passage","Klaxonner","Passer avant lui si je suis proche"],"answers":[1],"explanation":"Le conducteur doit céder, au besoin en s’arrêtant, au piéton engagé ou manifestant clairement l’intention de tr function read(k,f){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(f))}catch(e){return f}}
function write(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function same(a,b){const aa=[...a].sort((x,y)=>x-y),bb=[...b].sort((x,y)=>x-y);return aa.length===bb.length&&aa.every((x,i)=>x===bb[i])}
function mistakes(){return read('codeready_mistakes_v4',{})}
function reviews(){return read('codeready_review_v4',read('codeready_review_v3',{}))}
function smartSet(){const m=mistakes(),r=reviews(),used=new Set(),out=[];Object.entries(m).sort((a,b)=>(b[1].count||0)-(a[1].count||0)).forEach(([id])=>{const q=QUESTION_BANK.find(x=>x.id===id);if(q&&!used.has(id)&&out.length<10){out.push(q);used.add(id)}});Object.entries(r).filter(([,s])=>s==='review').forEach(([id])=>{const q=QUESTION_BANK.find(x=>x.id===id);if(q&&!used.has(id)&&out.length<10){out.push(q);used.add(id)}});shuffle(QUESTION_BANK.filter(q=>q.difficulty==='difficile')).concat(shuffle(QUESTION_BANK)).forEach(q=>{if(!used.has(q.id)&&out.length<10){out.push(q);used.add(q.id)}});return out}
function weakThemes(){const m=mistakes(),counts={};Object.entries(m).forEach(([id,e])=>{const q=QUESTION_BANK.find(x=>x.id===id);if(q)counts[q.category]=(counts[q.category]||0)+(e.count||1)});return Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,4)}
function start(){const m=mistakes(),r=reviews(),weak=weakThemes(),err=Object.keys(m).length,rev=Object.values(r).filter(x=>x==='review').length;app.innerHTML='<section class="start"><article class="card main"><span class="eyebrow">✨ COACH HÉLOÏSE</span><h1>Travaille ce qui<br>te fera gagner des points.</h1><p>Le Coach ne te donne pas dix questions au hasard. Il commence par les règles déjà ratées en examen, ajoute ce que tu as marqué « À revoir », puis complète avec des questions exigeantes.</p><div class="support"><b>Pour toi, Héloïse 💚</b><br>Une erreur ici est utile : elle vaut mieux aujourd’hui que le jour de l’examen. Lilian est derrière toi à chaque étape.</div><div class="actions"><button class="btn primary" id="go">Lancer ma série ciblée</button><a class="btn secondary" href="examen.html">Faire un examen complet</a></div></article><aside class="card side"><div class="stats"><div class="stat"><b>'+err+'</b><span>erreurs mémorisées</span></div><div class="stat"><b>'+rev+'</b><span>questions à revoir</span></div><div class="stat"><b>10</b><span>questions ciblées</span></div><div class="stat"><b>∞</b><span>séries possibles</span></div></div><div class="weak"><h3>Thèmes à renforcer</h3>'+(weak.length?weak.map(([k,v])=>'<div class="weak-row"><span>'+META[k][0]+' '+META[k][1]+'</span><b>'+v+' pt'+(v>1?'s':'')+'</b></div>').join(''):'<div style="color:var(--muted);font-size:.74rem;line-height:1.5">Aucune faiblesse détectée pour l’instant. Fais un examen blanc pour alimenter le Coach.</div>')+'</div></aside></section>';document.getElementById('go').onclick=begin}
function begin(){session=smartSet();idx=0;selected=new Set();results=[];locked=false;show()}
function icon(q){const v=q.visual;if(v&&v.startsWith('speed:'))return '🚦 '+v.split(':')[1];const map={rain:'🌧️',stop:'🛑',intersection:'↔️',amber:'🟠',red:'🔴',lane:'🛣️',bike:'🚲',rail:'🚆',solidline:'➖',motorway:'🛣️',alcohol:'🍷',phone:'📵',coffee:'☕',brake:'🛑',reaction:'⏱️',warning:'⚠️',medicine:'💊',sleep:'😴',fog:'🌫️',breakdown:'🚧',tunnel:'🚇',snow:'❄️',wind:'💨',ice:'🧊',works:'🚧',emergency:'🚑',pedestrian:'🚶',truck:'🚛',children:'🧒',motorcycle:'🏍️',bus:'🚌',horse:'🐎',scooter:'🛴',tram:'🚋',quiz:'❓',score:'🏁',euro:'💶',points:'6️⃣',insurance:'🛡️',document:'📝',horn:'📣',hazard:'⚠️',inspection:'🔎',vest:'🦺',firstaid:'🩹','112':'📞',aed:'❤️',fire:'🔥',seat:'💺',headrest:'💺',reverse:'↩️',parking:'🅿️',gps:'🧭',defog:'🌬️',pet:'🐕',belt:'🔒',tire:'🛞',oil:'🛢️',abs:'ABS',esp:'ESP',coolant:'🌡️',wiper:'🌧️',lights:'💡',adblue:'💧',childseat:'👶',airbag:'🎈',luggage:'🧳',roofbox:'🧳',load:'📦',heat:'☀️',eco:'🌱',ac:'❄️',service:'🔧',carpool:'👥',ev:'⚡',yield:'🔻',roundabout:'🔄',hill:'⛰️',mirror:'🪞'};return map[v]||'🚗'}
function show(){const q=session[idx];selected=new Set();locked=false;app.innerHTML='<section class="quiz"><article class="qpanel"><div class="qhead"><div><div class="counter">Question '+(idx+1)+' / 10</div><div class="theme">'+q.icon+' '+q.categoryName+'</div></div><span style="color:var(--muted);font-size:.72rem">Apprentissage ciblé</span></div><div class="body"><div class="visual">'+icon(q)+'</div><h2 class="question">'+q.question+'</h2>'+(q.answers.length>1?'<div class="multi">Plusieurs réponses peuvent être correctes.</div>':'')+'<div class="choices">'+q.choices.map((c,i)=>'<button class="choice" data-i="'+i+'"><span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+c+'</span></button>').join('')+'</div><div id="feedback"></div><div class="qactions"><button class="btn primary" id="validate" disabled>Valider</button></div></div></article><aside class="qside"><div class="map">'+session.map((x,i)=>'<div class="dot '+(i===idx?'cur':i<idx?(results[i]?'done':'wrong'):'')+'">'+(i+1)+'</div>').join('')+'</div><div class="tip"><b>Pourquoi ce mode est différent :</b><br>pas de chrono, correction immédiate et priorité aux erreurs réelles. Ici on apprend avant de se remettre sous pression.</div></aside></section>';document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(locked)return;const i=+b.dataset.i;if(selected.has(i))selected.delete(i);else selected.add(i);document.querySelectorAll('.choice').forEach(x=>x.classList.toggle('sel',selected.has(+x.dataset.i)));document.getElementById('validate').disabled=!selected.size});document.getElementById('validate').onclick=validate}
function train(q,ok){const m=mistakes(),now=new Date().toISOString();if(!ok){const e=m[q.id]||{count:0};e.count=(e.count||0)+1;e.lastWrong=now;e.category=q.category;m[q.id]=e}else if(m[q.id]){m[q.id].count=Math.max(0,(m[q.id].count||1)-1);m[q.id].lastCorrect=now;if(m[q.id].count===0)delete m[q.id]}write('codeready_mistakes_v4',m)}
function validate(){if(locked)return;locked=true;const q=session[idx],ok=same([...selected],q.answers);results.push(ok);train(q,ok);document.querySelectorAll('.choice').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.remove('sel');if(q.answers.includes(i))b.classList.add('good');else if(selected.has(i))b.classList.add('bad')});document.getElementById('feedback').innerHTML='<div class="feedback '+(ok?'ok':'no')+'"><b>'+(ok?'✅ Bonne réponse':'❌ À retenir')+'</b><br>'+q.explanation+'</div>';const v=document.getElementById('validate');v.disabled=false;v.textContent=idx===9?'Voir mon bilan':'Question suivante';v.onclick=()=>{idx++;if(idx>=10)finish();else show()}}
function finish(){const score=results.filter(Boolean).length;app.innerHTML='<section class="card finish"><div style="font-size:1rem;color:var(--green);font-weight:900">SÉRIE CIBLÉE TERMINÉE</div><h1>'+score+'/10</h1><p>'+(score>=9?'Excellent. Le Coach commence à manquer de faiblesses à te donner — c’est exactement le but.':score>=7?'Très bon travail. Refaire une série ciblée maintenant permettra de consolider les règles encore fragiles.':'C’est précisément à ça que sert le Coach : trouver les points faibles ici pour ne plus les perdre au vrai examen.')+'</p><div class="actions" style="justify-content:center"><button class="btn primary" id="again">Nouvelle série ciblée</button><a class="btn secondary" href="examen.html">🎯 Examen blanc</a><a class="btn secondary" href="index.html">📚 Les 50</a></div></section>';document.getElementById('again').onclick=begin;window.scrollTo({top:0,behavior:'smooth'})}
start();
</script></body></html>
