<script>
const QUESTION_BANK=[{"id":"L001","category":"L","categoryName":"Circulation","icon":"🛣️","question":"Sur autoroute, par temps sec et hors signalisation contraire, la vitesse maximale d’une voiture est :","choices":["110 km/h","120 km/h","130 km/h","140 km/h"],"answers":[2],"explanation":"La limitation générale sur autoroute est de 130 km/h par temps sec.","difficulty":"moyen","visual":"speed:130","top":true},{"id":"L002","category":"L","categoryName":"Circulation","icon":"🛣️","question":"Sous la pluie, la vitesse maximale générale sur autoroute est :","choices":["90 km/h","100 km/h","110 km/h","130 km/h"],"answers":[2],"explanation":"Sous la pluie, la limitation générale sur autoroute est abaissée à 110 km/h.","difficulty":"moyen","visual":"rain","top":true},{"id":"L003","category":"L","categoryName":"Circulation","icon":"🛣️","question":"À un panneau STOP, je dois :","choices":["Simplement ralentir","Marquer un arrêt complet","M’arrêter seulement si un véhicule arrive","Passer si je tourne à droite"],"answers":[1],"explanation":"Le STOP impose un arrêt complet à la ligne d’effet, puis le respect des règles de priorité.","difficulty":"moyen","visual":"stop","top":true},{"id":"L004","category":"L","categoryName":"Circulation","icon":"🛣️","question":"À une intersection sans panneau ni feu, la règle générale est :","choices":["Priorité à gauche","Priorité au véhicule le plus rapide","Priorité à droite","Priorité au véhicule le plus gros"],"answers":[2],"explanation":"Sans signalisation particulière, la priorité à droite s’applique.","difficulty":"moyen","visual":"intersection","top":true},{"id":"L005","category":"L","categoryName":"Circulation","icon":"🛣️","question":"Un feu orange fixe s’allume alors que je peux m’arrêter sans danger. Je dois :","choices":["Accélérer","M’arrêter","Klaxonner","Passer systématiquement"],"answers":[1],"explanation":"Le feu orange fixe impose l’arrêt, sauf si celui-ci ne peut être effectué dans des conditions de sécurité suffisantes.","difficulty":"moyen","visual":"amber","top":true},{"id":"L006","category":"L","categoryName":"Circulation","icon":"🛣️","question":"Un feu rouge m’impose :","choices":["Un ralentissement","Un arrêt","De céder seulement aux piétons","De passer si la voie paraît libre"],"answers":[1],"explanation":"Le feu rouge impose l’arrêt avant la ligne d’effet, le passage piéton ou le feu.","difficulty":"moyen","visual":"red","top":false},{"id":"L007","category":"L","categoryName":"Circulation","icon":"🛣️","question":"Un feu orange clignotant, sans autre signalisation de priorité, signifie généralement :","choices":["Arrêt obligatoire","Passage libre sans précaution","Prudence et application des règles de priorité","Priorité absolue"],"answers":[2],"explanation":"Le feu orange clignotant attire l’attention sur un danger ; les règles de priorité restent à appliquer.","difficulty":"moyen","visual":"amber","top":false},{"id":"L008","category":"L","categoryName":"Circulation","icon":"🛣️","question":"Je change de voie. Qui est prioritaire ?","choices":["Moi si j’ai mis le clignotant","Les véhicules déjà présents sur la voie visée","Le véhicule le plus rapide","Personne"],"answers":[1],"explanation":"Le clignotant informe mais ne donne jamais la priorité. Je dois céder aux véhicules déjà engagés sur la voie.","difficulty":"moyen","visual":"lane","top":false},{"id":"L009","category":"L","categoryName":"Circulation","icon":"🛣️","question":"Pour dépasser un cycliste, je dois laisser au minimum :","choices":["50 cm partout","1 m en agglomération et 1,5 m hors agglomération","2 m partout","Aucune distance minimale"],"answers":[1],"explanation":"La distance latérale minimale est d’1 m en agglomération et 1,5 m hors agglomération.","difficulty":"moyen","visual":"bike","top":false},{"id":"L010","category":"L","categoryName":"Circulation","icon":"🛣️","question":"À un passage à niveau dont le feu rouge clignote, je dois :","choices":["Passer si je ne vois pas de train","M’arrêter","Accélérer pour traverser vite","M’arrêter uniquement si les barrières sont baissées"],"answers":[1],"explanation":"Le feu rouge clignotant d’un passage à niveau impose l’arrêt.","difficulty":"moyen","visual":"rail","top":false},{"id":"L011","category":"L","categoryName":"Circulation","icon":"🛣️","question":"Je peux franchir une ligne continue pour dépasser un véhicule lent :","choices":["Oui toujours","Non, en principe","Oui si je klaxonne","Oui la nuit"],"answers":[1],"explanation":"Le franchissement d’une ligne continue est interdit sauf exceptions prévues par le Code ; on ne la franchit pas pour un dépassement ordinaire.","difficulty":"moyen","visual":"solidline","top":false},{"id":"L012","category":"L","categoryName":"Circulation","icon":"🛣️","question":"Sur autoroute, la bande d’arrêt d’urgence sert principalement :","choices":["À téléphoner","À dépasser","Aux arrêts d’urgence et interventions","À rouler quand il y a des bouchons"],"answers":[2],"explanation":"La bande d’arrêt d’urgence est réservée aux situations d’urgence et aux véhicules autorisés.","difficulty":"moyen","visual":"motorway","top":false},{"id":"C001","category":"C","categoryName":"Conducteur","icon":"🧠","question":"Pour un conducteur non novice, le taux maximal d’alcool autorisé est en principe :","choices":["0,2 g/L de sang","0,5 g/L de sang","0,8 g/L de sang","1,0 g/L de sang"],"answers":[1],"explanation":"La limite générale est 0,5 g/L de sang.","difficulty":"moyen","visual":"alcohol","top":true},{"id":"C002","category":"C","categoryName":"Conducteur","icon":"🧠","question":"Pendant la période probatoire, le taux maximal d’alcool autorisé est :","choices":["0,0 g/L","0,2 g/L","0,5 g/L","0,8 g/L"],"answers":[1],"explanation":"Pour les conducteurs en permis probatoire, la limite est 0,2 g/L de sang.","difficulty":"moyen","visual":"alcohol","top":true},{"id":"C003","category":"C","categoryName":"Conducteur","icon":"🧠","question":"Tenir son téléphone en main en conduisant est :","choices":["Autorisé à faible vitesse","Autorisé au feu rouge","Interdit","Autorisé avec le haut-parleur"],"answers":[2],"explanation":"Le téléphone tenu en main est interdit en circulation, y compris lors d’un arrêt momentané dans le trafic.","difficulty":"moyen","visual":"phone","top":true},{"id":"C004","category":"C","categoryName":"Conducteur","icon":"🧠","question":"Une pause est recommandée environ toutes les :","choices":["30 min","1 h","2 h","4 h"],"answers":[2],"explanation":"Faire une pause environ toutes les 2 heures réduit le risque lié à la fatigue.","difficulty":"moyen","visual":"coffee","top":true},{"id":"C005","category":"C","categoryName":"Conducteur","icon":"🧠","question":"Si ma vitesse double, la distance de freinage est approximativement :","choices":["Deux fois plus grande","Trois fois plus grande","Quatre fois plus grande","Inchangée"],"answers":[2],"explanation":"La distance de freinage varie approximativement avec le carré de la vitesse : doubler la vitesse la multiplie par environ 4.","difficulty":"moyen","visual":"brake","top":true},{"id":"C006","category":"C","categoryName":"Conducteur","icon":"🧠","question":"Le temps de réaction d’un conducteur attentif est généralement de l’ordre de :","choices":["0,1 s","1 s","5 s","10 s"],"answers":[1],"explanation":"On retient généralement environ 1 seconde dans de bonnes conditions, davantage en cas de fatigue, alcool ou distraction.","difficulty":"moyen","visual":"reaction","top":false},{"id":"C007","category":"C","categoryName":"Conducteur","icon":"🧠","question":"Pour “faire baisser” plus vite l’alcoolémie, le café est :","choices":["Très efficace","Un peu efficace","Inefficace sur l’élimination de l’alcool","Efficace seulement avec une douche froide"],"answers":[2],"explanation":"Seul le temps permet à l’organisme d’éliminer l’alcool ; café, douche ou sport n’accélèrent pas significativement cette élimination.","difficulty":"moyen","visual":"coffee","top":false},{"id":"C008","category":"C","categoryName":"Conducteur","icon":"🧠","question":"Le cannabis peut notamment :","choices":["Améliorer l’attention","Allonger le temps de réaction","Réduire la fatigue","Améliorer la vision nocturne"],"answers":[1],"explanation":"Le cannabis altère l’attention, la perception et le temps de réaction.","difficulty":"moyen","visual":"warning","top":false},{"id":"C009","category":"C","categoryName":"Conducteur","icon":"🧠","question":"Un médicament avec un pictogramme de conduite de niveau élevé doit m’amener à :","choices":["Ignorer l’avertissement","Lire la notice et demander conseil au besoin","Doubler la dose","Conduire plus vite pour réduire le trajet"],"answers":[1],"explanation":"Les pictogrammes médicaments signalent un risque pour la conduite ; la notice et l’avis d’un professionnel de santé sont à prendre en compte.","difficulty":"moyen","visual":"medicine","top":false},{"id":"C010","category":"C","categoryName":"Conducteur","icon":"🧠","question":"La somnolence au volant peut être annoncée par :","choices":["Bâillements et paupières lourdes","Meilleure concentration","Hausse de l’acuité visuelle","Réflexes plus rapides"],"answers":[0],"explanation":"Bâillements, raideur de nuque, difficultés à maintenir la trajectoire et paupières lourdes sont des signes d’alerte.","difficulty":"moyen","visual":"sleep","top":false},{"id":"C011","category":"C","categoryName":"Conducteur","icon":"🧠","question":"La distance d’arrêt comprend :","choices":["Uniquement la distance de freinage","Distance de réaction + distance de freinage","Uniquement la distance de réaction","La longueur du véhicule"],"answers":[1],"explanation":"Distance d’arrêt = distance parcourue pendant le temps de réaction + distance de freinage.","difficulty":"moyen","visual":"brake","top":false},{"id":"C012","category":"C","categoryName":"Conducteur","icon":"🧠","question":"Conduire stressé ou très énervé peut :","choices":["Réduire les erreurs","Altérer les décisions et la perception du risque","N’avoir aucun effet","Améliorer systématiquement les réflexes"],"answers":[1],"explanation":"Un état émotionnel intense peut dégrader l’attention et la prise de décision.","difficulty":"moyen","visual":"warning","top":false},{"id":"R001","category":"R","categoryName":"Route","icon":"🌧️","question":"Si la visibilité est inférieure à 50 m à cause du brouillard, ma vitesse maximale est :","choices":["30 km/h","50 km/h","70 km/h","90 km/h"],"answers":[1],"explanation":"Quand la visibilité est inférieure à 50 m, la vitesse maximale est limitée à 50 km/h sur toutes les routes.","difficulty":"moyen","visual":"fog","top":true},{"id":"R002","category":"R","categoryName":"Route","icon":"🌧️","question":"Sur chaussée mouillée, la distance de freinage :","choices":["Diminue","Augmente","Ne change jamais","Devient nulle avec l’ABS"],"answers":[1],"explanation":"L’adhérence diminue sur chaussée mouillée : la distance de freinage augmente.","difficulty":"moyen","visual":"rain","top":true},{"id":"R003","category":"R","categoryName":"Route","icon":"🌧️","question":"En cas d’aquaplanage, je dois surtout :","choices":["Freiner brutalement","Donner de grands coups de volant","Relâcher progressivement l’accélérateur et garder le volant stable","Accélérer fortement"],"answers":[2],"explanation":"Les gestes brusques aggravent la perte d’adhérence ; il faut réduire progressivement l’allure et garder une trajectoire stable.","difficulty":"moyen","visual":"rain","top":true},{"id":"R004","category":"R","categoryName":"Route","icon":"🌧️","question":"Pour entrer sur autoroute par une voie d’insertion, je dois :","choices":["Être prioritaire","M’insérer en cédant le passage","M’arrêter en bout de voie dans tous les cas","Rouler sur la bande d’arrêt d’urgence"],"answers":[1],"explanation":"La voie d’insertion ne rend pas prioritaire : j’adapte mon allure et je cède le passage aux véhicules déjà sur l’autoroute.","difficulty":"moyen","visual":"motorway","top":true},{"id":"R005","category":"R","categoryName":"Route","icon":"🌧️","question":"En cas de panne sur autoroute, après m’être immobilisé au mieux en sécurité, je dois notamment :","choices":["Rester devant la voiture","Sortir côté circulation","Me mettre derrière la glissière si possible","Marcher sur l’autoroute pour chercher de l’aide"],"answers":[2],"explanation":"Les occupants doivent quitter le véhicule du côté opposé à la circulation et se placer derrière la glissière lorsque c’est possible.","difficulty":"moyen","visual":"breakdown","top":true},{"id":"R006","category":"R","categoryName":"Route","icon":"🌧️","question":"Dans un tunnel, j’allume au minimum :","choices":["Les feux de position seuls","Les feux de croisement","Les feux de route","Aucun feu de jour"],"answers":[1],"explanation":"Les feux de croisement assurent la visibilité du véhicule dans un tunnel.","difficulty":"moyen","visual":"tunnel","top":false},{"id":"R007","category":"R","categoryName":"Route","icon":"🌧️","question":"Sur neige ou verglas, la bonne conduite consiste à :","choices":["Multiplier les gestes brusques","Augmenter les distances et conduire avec douceur","Freiner le plus tard possible","Suivre de très près le véhicule devant"],"answers":[1],"explanation":"Sur faible adhérence, on augmente les distances et on évite les accélérations, freinages et braquages brusques.","difficulty":"moyen","visual":"snow","top":false},{"id":"R008","category":"R","categoryName":"Route","icon":"🌧️","question":"Par fort vent latéral, je dois :","choices":["Tenir fermement le volant et anticiper les écarts","Rouler plus vite","Me rapprocher des poids lourds","Freiner au milieu de ma voie sans raison"],"answers":[0],"explanation":"Le vent peut déporter le véhicule, surtout à la sortie d’une zone abritée ou lors du dépassement d’un poids lourd.","difficulty":"moyen","visual":"wind","top":false},{"id":"R009","category":"R","categoryName":"Route","icon":"🌧️","question":"Faire demi-tour sur autoroute est :","choices":["Autorisé si la route est vide","Interdit","Autorisé la nuit","Autorisé sur la bande d’arrêt d’urgence"],"answers":[1],"explanation":"Demi-tour et marche arrière sont interdits sur autoroute.","difficulty":"moyen","visual":"motorway","top":false},{"id":"R010","category":"R","categoryName":"Route","icon":"🌧️","question":"Une chaussée brillante par temps froid peut annoncer :","choices":["Une adhérence parfaite","Du verglas","Un marquage neuf uniquement","Aucun danger particulier"],"answers":[1],"explanation":"Le verglas peut être difficile à voir ; les zones ombragées, ponts et chaussées humides sont particulièrement à risque.","difficulty":"moyen","visual":"ice","top":false},{"id":"R011","category":"R","categoryName":"Route","icon":"🌧️","question":"À l’approche d’un chantier, je dois :","choices":["Maintenir absolument ma vitesse","Adapter ma vitesse et anticiper les changements de voie","Ignorer le balisage temporaire","Suivre uniquement les marquages permanents"],"answers":[1],"explanation":"La signalisation temporaire prime sur la signalisation permanente lorsqu’elles sont en contradiction.","difficulty":"moyen","visual":"works","top":false},{"id":"R012","category":"R","categoryName":"Route","icon":"🌧️","question":"Sur autoroute encombrée, le corridor de sécurité pour les secours se crée :","choices":["Sur la bande d’arrêt d’urgence uniquement","Entre les deux files les plus à gauche","Au milieu de chaque voie","Sur la file de droite seulement"],"answers":[1],"explanation":"En circulation très ralentie, les véhicules s’écartent pour créer un corridor entre les deux voies les plus à gauche.","difficulty":"moyen","visual":"emergency","top":false},{"id":"U001","category":"U","categoryName":"Autres usagers","icon":"🚲","question":"Un piéton manifeste clairement l’intention de traverser sur un passage piéton. Je dois :","choices":["Accélérer","Lui céder le passage","Klaxonner","Passer avant lui si je suis proche"],"answers":[1],"explanation":"Le conducteur doit céder, au besoin en s’arrêtant, au piéton engagé ou manifestant clairement l’intention de traverser.","difficulty":"moyen","visual":"pedestrian","top":true},{"id":"U002","category":"U","categoryName":"Autres usagers","icon":"🚲","question":"En ville, en dépassant un cycliste, je laisse au moins :","choices":["50 cm","1 m","1,5 m","2 m"],"answers":[1],"explanation":"La distance minimale latérale est d’1 m en agglomération.","difficulty":"moyen","visual":"bike","top":true},{"id":"U003","category":"U","categoryName":"Autres usagers","icon":"🚲","question":"Hors agglomération, en dépassant un cycliste, je laisse au moins :","choices":["50 cm","1 m","1,5 m","2,5 m"],"answers":[2],"explanation":"La distance minimale latérale est d’1,5 m hors agglomération.","difficulty":"moyen","visual":"bike","top":true},{"id":"U004","category":"U","categoryName":"Autres usagers","icon":"🚲","question":"Près d’un poids lourd, je dois me méfier particulièrement :","choices":["De ses angles morts","De sa petite largeur","De son accélération supérieure à une moto","De son absence totale de freinage"],"answers":[0],"explanation":"Les poids lourds ont des angles morts importants ; éviter d’y rester est essentiel.","difficulty":"moyen","visual":"truck","top":true},{"id":"U005","category":"U","categoryName":"Autres usagers","icon":"🚲","question":"Avant d’ouvrir ma portière côté circulation, je dois :","choices":["L’ouvrir rapidement","Vérifier rétroviseur et angle mort","Me fier au bruit uniquement","Mettre les feux de détresse"],"answers":[1],"explanation":"Vérifier l’arrière et l’angle mort réduit le risque d’ouverture de portière devant un cycliste ou un deux-roues.","difficulty":"moyen","visual":"door","top":true},{"id":"U006","category":"U","categoryName":"Autres usagers","icon":"🚲","question":"À proximité d’enfants, je dois :","choices":["Prévoir des réactions imprévisibles","Supposer qu’ils m’ont vu","Accélérer pour passer vite","Utiliser systématiquement le klaxon"],"answers":[0],"explanation":"Les enfants peuvent changer brusquement de direction ; il faut réduire l’allure et anticiper.","difficulty":"moyen","visual":"children","top":false},{"id":"U007","category":"U","categoryName":"Autres usagers","icon":"🚲","question":"Un motocycliste peut être difficile à évaluer parce que :","choices":["Sa vitesse et sa distance sont parfois mal appréciées","Il est toujours prioritaire","Il s’arrête instantanément","Il n’a jamais d’angle mort"],"answers":[0],"explanation":"Le faible gabarit d’un deux-roues rend l’évaluation de sa distance et de sa vitesse plus difficile.","difficulty":"moyen","visual":"motorcycle","top":false},{"id":"U008","category":"U","categoryName":"Autres usagers","icon":"🚲","question":"En agglomération, un bus signale qu’il quitte son arrêt. Je dois :","choices":["L’empêcher de s’insérer","Faciliter sa réinsertion","Accélérer systématiquement","Le dépasser par la droite"],"answers":[1],"explanation":"En agglomération, il faut ralentir et, si nécessaire, s’arrêter pour permettre aux transports en commun de quitter un arrêt signalé.","difficulty":"moyen","visual":"bus","top":false},{"id":"U009","category":"U","categoryName":"Autres usagers","icon":"🚲","question":"À proximité d’un cavalier, il est préférable de :","choices":["Passer très près","Ralentir et éviter les bruits brusques","Klaxonner longuement","Accélérer fortement"],"answers":[1],"explanation":"Un animal peut être surpris ; ralentir et garder une distance suffisante réduit le risque.","difficulty":"moyen","visual":"horse","top":false},{"id":"U010","category":"U","categoryName":"Autres usagers","icon":"🚲","question":"Les trottinettes électriques sont des usagers :","choices":["Sans règles spécifiques","Vulnérables à prendre en compte dans le partage de la route","Toujours autorisés sur les trottoirs","Toujours prioritaires"],"answers":[1],"explanation":"Les EDP motorisés sont des usagers vulnérables soumis à des règles spécifiques ; leur présence doit être anticipée.","difficulty":"moyen","visual":"scooter","top":false},{"id":"U011","category":"U","categoryName":"Autres function startScreen(){clearInterval(timer);const s=stats();app.innerHTML=`<section class="start-card"><div class="start-main"><span class="eyebrow">🎯 SIMULATION D’HÉLOÏSE</span><h1>40 questions.<br>Tu sais le faire.</h1><p>Une série équilibrée sur les 10 thèmes, 20 secondes par question et aucune correction avant la fin. Cherche surtout la régularité au-dessus de 35/40 : chaque série te rapproche du vrai examen.</p><div class="hero-actions"><button class="btn btn-primary" id="start">Démarrer l’examen</button><a class="btn btn-secondary" href="index.html">Réviser d’abord</a></div></div><aside class="start-side"><div class="exam-rules"><div class="exam-rule"><b>40</b><span>questions</span></div><div class="exam-rule"><b>20 s</b><span>par question</span></div><div class="exam-rule"><b>35/40</b><span>seuil cible</span></div><div class="exam-rule"><b>${s.best}${s.best==='—'?'':'/40'}</b><span>meilleur score</span></div></div><div class="history-box"><div class="history-title">Dernières séries sur cet appareil</div><div class="history-scores">${s.recent.length?s.recent.map(x=>`<span class="history-score">${x.score}/40</span>`).join(''):'<span style="color:var(--muted);font-size:.75rem">Aucune série terminée pour le moment.</span>'}</div></div><div class="notice"><strong>Banque d’entraînement :</strong> 180 questions originales. Elles reproduisent les thèmes et la logique de l’ETG, pas les questions officielles.</div></aside></section>`;document.getElementById('start').onclick=startExam}
function startExam(){exam=buildExam();idx=0;answers=[];selected=new Set();showQuestion()}
function visual(v){if(v&&v.startsWith('speed:'))return `<div class="speed-sign">${v.split(':')[1]}</div>`;const m={rain:'🌧️',stop:'🛑',intersection:'↔️',amber:'🟠',red:'🔴',lane:'🛣️',bike:'🚲',rail:'🚆',solidline:'➖',motorway:'🛣️',alcohol:'🍷',phone:'📵',coffee:'☕',brake:'🛑',reaction:'⏱️',warning:'⚠️',medicine:'💊',sleep:'😴',fog:'🌫️',breakdown:'🚧',tunnel:'🚇',snow:'❄️',wind:'💨',ice:'🧊',works:'🚧',emergency:'🚑',pedestrian:'🚶',truck:'🚛',door:'🚪',children:'🧒',motorcycle:'🏍️',bus:'🚌',horse:'🐎',scooter:'🛴',tram:'🚋',quiz:'❓',score:'🏁',euro:'💶',points:'6️⃣',insurance:'🛡️',document:'📝',horn:'📣',hazard:'⚠️',inspection:'🔎',vest:'🦺',firstaid:'🩹','112':'📞',aed:'❤️',fire:'🔥',seat:'💺',headrest:'💺',reverse:'↩️',parking:'🅿️',gps:'🧭',defog:'🌬️',pet:'🐕',belt:'🔒',tire:'🛞',oil:'🛢️',abs:'ABS',esp:'ESP',coolant:'🌡️',wiper:'🌧️',lights:'💡',adblue:'💧',childseat:'👶',airbag:'🎈',luggage:'🧳',roofbox:'🧳',load:'📦',heat:'☀️',eco:'🌱',ac:'❄️',service:'🔧',carpool:'👥',ev:'⚡',yield:'🔻',roundabout:'🔄',hill:'⛰️',mirror:'🪞'};return `<div class="visual-content visual-big">${m[v]||'🚘'}</div>`}
function mapHtml(){return Array.from({length:40},(_,i)=>{let cl='qdot';if(i===idx)cl+=' current';if(i<answers.length)cl+=answers[i]?.timeout?' timeout':' done';return `<div class="${cl}">${i+1}</div>`}).join('')}
function renderSide(){const answered=answers.length;return `<aside class="exam-side"><div class="side-card"><h3>Progression de la série</h3><div class="question-map">${mapHtml()}</div><div class="legend"><span><i class="lg-cur"></i>en cours</span><span><i class="lg-done"></i>répondu</span><span><i class="lg-timeout"></i>temps écoulé</span></div></div><div class="side-card"><div class="exam-side-kpis"><div class="side-kpi"><b>${answered}/40</b><span>terminées</span></div><div class="side-kpi"><b>${40-answered}</b><span>restantes</span></div></div></div><div class="side-card tip"><b>Raccourcis clavier</b><br>A, B, C ou D pour sélectionner. Entrée pour valider. Sur une question à réponses multiples, les lettres activent/désactivent chaque choix.</div></aside>`}
function showQuestion(){clearInterval(timer);selected=new Set();left=20;const q=exam[idx];app.innerHTML=`<section class="exam-grid"><article class="question-panel"><div class="question-head"><div><div class="question-counter">Question ${idx+1} <span style="color:var(--muted)">/ 40</span></div><div class="question-theme">${q.icon} ${q.categoryName}</div></div><div class="timer-wrap"><div class="timer-label">Temps<br>restant</div><div class="timer-ring" id="timerRing" style="--pct:100%"><span id="timerText">20</span></div></div></div><div class="question-progress"><span style="width:${idx/40*100}%"></span></div><div class="question-body"><div class="scene">${visual(q.visual)}</div><h2 class="exam-q">${q.question}</h2><div class="multi-note">${q.answers.length>1?'Plusieurs bonnes réponses possibles':'Une seule bonne réponse'}</div><div class="choices">${q.choices.map((c,i)=>`<button class="choice" data-i="${i}"><span class="letter">${String.fromCharCode(65+i)}</span><span class="choice-text">${c}</span></button>`).join('')}</div><div class="exam-actions"><div class="shortcuts"><span><span class="kbd">A–D</span> choisir</span><span><span class="kbd">Entrée</span> valider</span></div><div style="display:flex;gap:8px"><button class="btn btn-danger" id="quit">Quitter</button><button class="btn btn-primary" id="validate" disabled>Valider →</button></div></div></div></article>${renderSide()}</section>`;
 const choose=(i)=>{const buttons=[...app.querySelectorAll('.choice')];if(q.answers.length===1){selected=new Set([i]);buttons.forEach(x=>x.classList.toggle('selected',+x.dataset.i===i))}else{selected.has(i)?selected.delete(i):selected.add(i);buttons[i].classList.toggle('selected')}document.getElementById('validate').disabled=selected.size===0};
 app.querySelectorAll('.choice').forEach(b=>b.onclick=()=>choose(+b.dataset.i));document.getElementById('validate').onclick=()=>submit(false);document.getElementById('quit').onclick=()=>{if(confirm('Quitter cette série ? La progression de cette série sera perdue.'))startScreen()};
 document.onkeydown=e=>{if(!exam.length||!document.getElementById('validate'))return;const k=e.key.toUpperCase();if(['A','B','C','D'].includes(k)){const i=k.charCodeAt(0)-65;if(i<q.choices.length){e.preventDefault();choose(i)}}else if(e.key==='Enter'&&selected.size){e.preventDefault();submit(false)}};
 timer=setInterval(()=>{left--;const t=document.getElementById('timerText'),r=document.getElementById('timerRing');if(t)t.textContent=left;if(r){r.style.setProperty('--pct',(left/20*100)+'%');r.classList.toggle('urgent',left<=5)}if(left<=0)submit(true)},1000)}
function submit(timeout){clearInterval(timer);answers.push({id:exam[idx].id,selected:[...selected],timeout});idx++;if(idx>=40)finish();else showQuestion()}
function same(a,b){const aa=[...a].sort((x,y)=>x-y),bb=[...b].sort((x,y)=>x-y);return aa.length===bb.length&&aa.every((x,i)=>x===bb[i])}
function finish(){clearInterval(timer);document.onkeydown=null;let score=0;const detail=exam.map((q,i)=>{const ok=same(answers[i].selected,q.answers);if(ok)score++;return{q,a:answers[i],ok}});learnFrom(detail);const pass=score>=35;const by={};detail.forEach(d=>{by[d.q.category]??={ok:0,total:0,name:d.q.categoryName,icon:d.q.icon};by[d.q.category].total++;if(d.ok)by[d.q.category].ok++});const byTheme={};Object.entries(by).forEach(([k,v])=>byTheme[k]={ok:v.ok,total:v.total});let hist=getHistory();hist.push({score,date:new Date().toISOString(),byTheme,wrongIds:detail.filter(d=>!d.ok).map(d=>d.q.id),timeouts:detail.filter(d=>d.a.timeout).length});try{localStorage.setItem('codeready_scores_v3',JSON.stringify(hist.slice(-80)))}catch(e){}
 app.innerHTML=`<section class="results-shell"><article class="results-main"><div class="score-hero"><div class="score-ring" style="--score:${score/40*100}%"><b>${score}/40</b></div><div class="result-title"><h2>${pass?'✅ Série réussie':'📚 Objectif : 35/40'}</h2><p>${pass?'Tu atteins le seuil. Le vrai objectif maintenant est de répéter ce niveau sur plusieurs séries consécutives.':'Utilise la correction ci-dessous pour isoler les règles qui te coûtent des points, puis relance une série.'}</p></div></div><div class="result-controls"><button class="filter-btn active" data-filter="all">Toutes (40)</button><button class="filter-btn" data-filter="wrong">Erreurs (${40-score})</button></div><div class="review-list" id="reviewList">${detail.map((d,i)=>`<div class="review-card ${d.ok?'correct':'wrong'}" data-result="${d.ok?'correct':'wrong'}"><h4>${d.ok?'✅':'❌'} ${i+1}. ${d.q.question}</h4><p><strong>Ta réponse :</strong> ${d.a.selected.length?d.a.selected.map(j=>`${String.fromCharCode(65+j)}. ${d.q.choices[j]}`).join(' · '):(d.a.timeout?'Temps écoulé':'Aucune réponse')}</p><p><strong style="color:var(--green)">Bonne réponse :</strong> ${d.q.answers.map(j=>`${String.fromCharCode(65+j)}. ${d.q.choices[j]}`).join(' · ')}</p><p>${d.q.explanation}</p></div>`).join('')}</div></article><aside class="results-side"><div class="side-card"><h3>Résultat par thème</h3><div class="breakdown">${Object.values(by).map(x=>`<div class="break-item"><span>${x.icon} ${x.name}</span><b>${x.ok}/${x.total}</b></div>`).join('')}</div></div><button class="btn btn-primary" id="again">Nouvel examen</button><a class="btn btn-secondary" href="coach.html">✨ Travailler mes erreurs</a><a class="btn btn-secondary" href="progression.html">📈 Voir ma progression</a><a class="btn btn-secondary" href="index.html">Réviser les 50</a></aside></section>`;
 document.getElementById('again').onclick=startExam;document.querySelectorAll('.filter-btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter-btn').forEach(x=>x.classList.toggle('active',x===b));const f=b.dataset.filter;document.querySelectorAll('.review-card').forEach(c=>c.hidden=f==='wrong'&&c.dataset.result!=='wrong')});window.scrollTo({top:0,behavior:'smooth'})}
startScreen();
</script></body></html>
